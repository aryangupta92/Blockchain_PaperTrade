services:
  postgres:
    image: postgres:16-alpine
    container_name: blocktrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker_dev_password
      POSTGRES_DB: blocktrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d blocktrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blocktrade-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
